# Workspace build tuning for faster dev-loop and verification.
#
# Rationale (see `cargo gate` and .kiro/steering/testing.md):
# the verification bottleneck is the test phase over ~9000 tests across 69
# crates. These settings reduce per-run compile cost without changing test
# behaviour or release output. They affect only local build performance and are
# fully reversible (delete this file to restore stock cargo defaults).

# Note on linkers: LLVM lld ships with the toolchain as rust-lld. It is NOT
# enabled here, and a measured spike (CR-CH-047 follow-up, 2026-09-24) showed
# why: on this Windows/MSVC toolchain (rustc 1.98, LLVM 22) an A/B of the
# ff-desktop test-binary INCREMENTAL relink was ~2x SLOWER under rust-lld
# (lld-link) than the default MSVC link.exe -- 23.3s vs 12.2s. MSVC link.exe's
# incremental linking beats lld's full relink for a single Windows binary; lld's
# usual win is Linux / cold full links, not Windows incremental. So rust-lld is
# a REGRESSION for this workload and is deliberately left off. The `-C
# linker-flavor=lld-link -C linker=rust-lld` rustflags DID link correctly (so it
# is available if a future Linux/CI path wants it), it is just slower here.
# The profile tuning below remains the safe, high-value local win.

# Development/test profile: keep builds cheap to (re)compile.
[profile.dev]
# Incremental compilation caches per-module codegen between runs -- large win
# for the warm-rebuild inner loop.
incremental = true

[profile.test]
# Test binaries do not need full debuginfo for the pass/fail verification gate;
# dropping it cuts codegen and link time substantially over ~9000 tests.
debug = 0
incremental = true

# Canonical verification gate.
#
# `cargo gate` is the external cargo-gate tool (installed on PATH). The CANONICAL
# full gate for this workspace is `cargo gate --build` -- the `--build` phase is
# what leaves a FRESH, RUNNABLE ffwb.exe in target/ (without it a clean gate can
# still leave a STALE app binary -- the B082 trap). The alias below is a
# convenience so the canonical form is one command that ALWAYS includes --build;
# it is named `full-gate` (not `gate`) to avoid shadowing the external `gate`
# subcommand. See .kiro/steering/testing.md for scopes and the hand-off protocol.
#   cargo full-gate                 # == cargo gate --build (full completion gate)
# Scoped forms stay explicit, e.g. `cargo gate --crate <name>` for a single crate.
[alias]
full-gate = "gate --build"
