    "crates/ff-connector-local-fs",
    "crates/ff-core",
    "crates/ff-display-line-mapping",
    "crates/ff-document-model",
    "crates/ff-edit-operations",
    "crates/ff-encoding",
    "crates/ff-exclude-show-filter",
    "crates/ff-external-mod",
    "crates/ff-file-ops",
    "crates/ff-find-and-replace",
    "crates/ff-help",
    "crates/ff-keys",
    "crates/ff-language-service",
