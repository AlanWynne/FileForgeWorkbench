    "crates/ff-navigation-commands",
    "crates/ff-plugin",
    "crates/ff-session",
    "crates/ff-shell",
    "crates/ff-syntax-highlighting",
    "crates/ff-tabs",
    "crates/ff-tabmask",
    "crates/ff-text-decorations",
    "crates/ff-theme",
    "crates/ff-undo-redo",
    "crates/ff-vfs",
    "crates/ff-viewport-scrolling",
    "crates/ff-whitespace-guides",
    "crates/ff-workflow",
    "crates/ff-wrap",
    "crates/ff-zoom",
    "crates/ff-hex",
    "crates/ff-seqnum",
    "crates/ff-viewers",
    "crates/ff-asa",
    "crates/ff-forge",
    "crates/ff-structure-catalog",
    "crates/ff-select",
    "crates/ff-dsalloc",
    "crates/ff-idcams",
    "crates/ff-dataset-catalog",
    "crates/ff-vsam-services",
    "crates/ff-governance-tests",
    "crates/ff-dscatalog",
    "crates/ff-idle-processing",
    "crates/ff-large-file-performance",
    "crates/ff-database-tool",
    "crates/ff-file-tree",
    "crates/ff-compare-merge",
    "crates/ff-jes",
    "crates/ff-screen-model",
    "crates/ff-scrm",
    "crates/ff-theme-editor",
    "crates/ff-toolchain-panel",
    "crates/ff-catalog-registry",
    "crates/ff-catalog-dialog",
    "crates/ff-dataset-alloc-dialog",
    "crates/ff-context-menu",
    "crates/ff-posix-provider",
    "crates/ff-ce-ntfs",
    "crates/ff-ce-posix",
    "crates/ff-ce-host-fs",
    "crates/ff-nav-model",
    "crates/ff-explorer-view",
    "crates/ff-scroll-amount",
    "crates/ff-exclude-manager",
    "crates/ff-editor-panel",
    "crates/ff-files-panel",
    "crates/ff-desktop",
    "crates/ff-toolchain-api",
    "crates/ff-gcc-toolchain",
    "crates/ff-rust-toolchain",
    "crates/ff-fftest",
    "crates/ff-global-search",
    # Viewer / Exporter family
    "crates/ff-md-viewer",
    "crates/ff-html-export",
    "crates/ff-pdf-export",
    "crates/ff-mdx-app",
    "crates/ff-mdx-installer",
    "crates/ff-mdx-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["FileForge Contributors"]
license = "Apache-2.0"

[workspace.dependencies]
# Shared dependency versions for workspace members
chrono = { version = "0.4", features = ["clock", "serde"] }
crossbeam-channel = "0.5"
thiserror = "2"
dirs = "5"
toml = "0.8"
proptest = "1"
tempfile = "3"
pretty_assertions = "1"
unicode-segmentation = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
# CR-CH-056 (Req 23.2): the `serde` feature gives egui::Style/Visuals/
# WidgetVisuals their own Serialize/Deserialize derives so a Theme's chrome
# layer embeds egui's native representation (rather than a hand-written mirror
# that could drift from egui's type).
egui = { version = "0.33", features = ["serde"] }
eframe = { version = "0.33", features = ["default_fonts"] }
pulldown-cmark = { version = "0.12", default-features = false, features = [
    "html",
] }
notify = { version = "7", default-features = false, features = [
    "macos_fsevent",
] }
egui_commonmark = { version = "0.22", features = ["pulldown_cmark"] }
rfd = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Release profile applies workspace-wide. Cargo only honours [profile.*] in the
# ROOT manifest (profiles in a member crate are ignored with a warning), so the
# ffmdx release-size settings that ff-mdx-app / ff-mdx-installer used to declare
# live here. Affects `cargo build --release` only (not debug/test builds).
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
