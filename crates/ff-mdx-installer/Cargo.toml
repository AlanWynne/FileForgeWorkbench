[package]
name = "ff-mdx-installer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Self-extracting egui installer for ffmdx"

[[bin]]
name = "ffmdx-setup"
path = "src/main.rs"

[dependencies]
egui.workspace = true
eframe.workspace = true
anyhow.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# NOTE: release-profile settings live in the workspace-root Cargo.toml.
# Cargo ignores [profile.*] in a non-root manifest (and warns), so they are not
# repeated here.
