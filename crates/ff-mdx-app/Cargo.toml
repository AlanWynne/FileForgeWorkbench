[package]
name = "ff-mdx-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Standalone Markdown Explorer -- ffmdx.exe"

[[bin]]
name = "ffmdx"
path = "src/main.rs"

[dependencies]
ff-md-viewer = { path = "../ff-md-viewer" }
ff-html-export = { path = "../ff-html-export" }
egui.workspace = true
eframe.workspace = true
egui_commonmark.workspace = true
anyhow.workspace = true
rfd = "0.15"

[dev-dependencies]
egui_kittest = { version = "0.33", features = ["eframe"] }
tempfile.workspace = true
pretty_assertions.workspace = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
