# Afrikaans (af) command-alias catalogue for the FFCMD command environment
# (CR-NR-109, localization Requirement 11, Task 11.7 -- proof-of-concept data).
#
# Each [[alias]] row maps a localised, typeable SURFACE form to the ROOT
# (canonical) command verb, optionally carrying a localisation_key that resolves
# the displayed surface through the ff-i18n catalogue (t(key)). The ROOT verb is
# the dispatched and persisted identity (Requirement 11.9); the surface is a
# display/typeable concern only. Loaded by shell/alias_reader.rs via the existing
# apply_locale_overlay seam -- no new mechanism.
#
# CR-CH-069 (command-environments Requirement 21.3): the former SOEK -> FIND row
# was MOVED to FFEDIT.toml because FIND is an FFEDIT root (command-semantics
# Requirement 12.1), not an FFCMD root. This FFCMD catalogue currently declares
# no aliases; genuine Afrikaans FFCMD aliases are a separate later DATA task.
