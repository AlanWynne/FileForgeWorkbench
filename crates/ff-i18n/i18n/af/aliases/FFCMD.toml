# Afrikaans (af) command-alias catalogue for the FFCMD command environment
# (CR-CH-072, localization Requirement 13 -- one-layer surface-in-row model).
#
# Each [[alias]] row maps a localised, typeable SURFACE form (the In_Row_Surface)
# DIRECTLY to the ROOT (canonical) command verb. The ROOT verb is the dispatched
# and persisted identity (Requirement 13.2); the surface is a display/typeable
# concern only. There is no localisation_key / verb-* indirection any more -- the
# surface IS the display text (Requirement 13.1). Loaded by
# shell/alias_reader.rs via the existing apply_locale_overlay seam.

# --- POM + Settings menu-root command-surface aliases (full af menu DATA) ---
# DRAFT Afrikaans surfaces, pending fluent review. Each row maps an Afrikaans
