# Afrikaans (af) command-alias catalogue for the FFEDIT command environment
# (CR-CH-072, localization Requirement 13 -- one-layer surface-in-row model).
#
# Each [[alias]] row maps a localised, typeable SURFACE form (the In_Row_Surface)
# DIRECTLY to the ROOT (canonical) command verb, with an OPTIONAL command_template
# (CR-NR-112). The ROOT verb is the dispatched and persisted identity
# (Requirement 13.2); the surface is a display/typeable concern only. There is no
# localisation_key / verb-* indirection any more -- the surface IS the display
# text (Requirement 13.1). Loaded by shell/alias_reader.rs via the existing
# apply_locale_overlay seam -- no new mechanism.
#
# CR-CH-069 (command-environments Requirement 21.3): SOEK -> FIND lives HERE,
# under FFEDIT, because FIND is an FFEDIT root (command-semantics Requirement
# 12.1; ffedit_english owns FIND).

[[alias]]
surface = "SOEK"
canonical = "FIND"
