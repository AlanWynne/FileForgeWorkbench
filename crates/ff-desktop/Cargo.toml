[package]
name = "ff-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "FileForgeWorkbench desktop shell — egui GUI entry point (ffwb binary)"

[[bin]]
name = "ffwb"
path = "src/main.rs"

[dependencies]
# core-001 strip (milestone core-001): the editor, file navigator, dataset
# catalog, VFS providers, and volume domains are UNWIRED from the `ffwb` binary
# and their crates PARKED (dropped here, still in the workspace `members`). See
# docs/reentry-register.md for the full map. KEPT per Option A: ff-document-model,
# ff-viewport-scrolling, ff-edit-operations, and ff-vfs are core TabState
# infrastructure used directly by the shell's per-tab state, so they remain
# direct dependencies even though the editor Context itself is unwired.
ff-core = { path = "../ff-core" }
ff-config = { path = "../ff-config" }
ff-logging = { path = "../ff-logging" }
ff-theme = { path = "../ff-theme" }
ff-document-model = { path = "../ff-document-model" }
ff-viewport-scrolling = { path = "../ff-viewport-scrolling" }
ff-vfs = { path = "../ff-vfs" }
ff-command = { path = "../ff-command" }
ff-command-semantics = { path = "../ff-command-semantics" }
ff-edit-operations = { path = "../ff-edit-operations" }
ff-find-and-replace = { path = "../ff-find-and-replace" }
ff-keys = { path = "../ff-keys" }
ff-help = { path = "../ff-help" }
ff-i18n = { path = "../ff-i18n" }
ff-session = { path = "../ff-session" }
ff-zoom = { path = "../ff-zoom" }
ff-toolchain-api = { path = "../ff-toolchain-api" }
ff-gcc-toolchain = { path = "../ff-gcc-toolchain" }
ff-rust-toolchain = { path = "../ff-rust-toolchain" }
ff-fftest = { path = "../ff-fftest" }
ff-global-search = { path = "../ff-global-search" }
ff-plugin = { path = "../ff-plugin" }
ff-shell = { path = "../ff-shell" }
ff-layout = { path = "../ff-layout" }
ff-screen-model = { path = "../ff-screen-model" }
ff-scrm = { path = "../ff-scrm" }
ff-theme-editor = { path = "../ff-theme-editor" }
ff-toolchain-panel = { path = "../ff-toolchain-panel" }
ff-context-menu = { path = "../ff-context-menu" }
anyhow = { workspace = true }
arboard = "3"
tokio = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
async-trait = "0.1"
thiserror = { workspace = true }
rfd = "0.17"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
] }
regex = "1"
dirs = { workspace = true }
egui-file-dialog = "0.12"

# Windows multi-flavor clipboard (screen-snapshot-scrm Req 23.5d): via its RAW
# API (raw::set_without_clear / raw::register_format) it opens the clipboard
# ONCE and writes CF_UNICODETEXT + CF_DIB + CF_DIBV5 (+ a registered PNG) in one
# transaction, so the picture AND text flavors are offered simultaneously and
# the DIB flavors are the ones Word / PowerPoint actually paste -- which
# `arboard` alone cannot do (single-flavor per set(), and the higher-level
# CF_BITMAP publish did not render in Office). The raw API is available in
# 5.4.3, so the pin stays EXACT per Req 23.7. Non-Windows targets fall back to
# `arboard` behind the same trait.
[target.'cfg(windows)'.dependencies]
clipboard-win = "=5.4.3"

[build-dependencies]
winres = "0.1"

[dev-dependencies]
egui_kittest = { version = "0.33", features = ["eframe"] }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
