[package]
name = "ff-forge"
version = "0.1.0"
edition = "2021"
description = "FileForge flat-file processing engine for FileForgeWorkbench — structure parsing, EBCDIC, COMP-3, VB binary, ASA detection"
authors = ["FileForge Contributors"]

[dependencies]
