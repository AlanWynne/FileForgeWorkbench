[package]
name = "ff-shell"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Shell command subsystem for FileForgeWorkbench — OS command execution, terminal integration, output capture"

[dependencies]
ff-command = { path = "../ff-command" }
ff-config = { path = "../ff-config" }
ff-layout = { path = "../ff-layout" }
ff-workflow = { path = "../ff-workflow" }
ff-document-model = { path = "../ff-document-model" }
ff-logging = { path = "../ff-logging" }
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt"] }
thiserror = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
dirs = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["term", "signal", "process"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
] }

[dev-dependencies]
proptest = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
